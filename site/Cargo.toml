[package]
name = "xetal-libraries-site"
description = "The live demo of X_eTaL-libraries: every library's reference, source and types, and its demos runnable and editable in the browser"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
xetal-play = { path = "../vendor/xetal/components/web/crates/xetal-play" }
xetal-store = { path = "../vendor/xetal/components/base/crates/xetal-store" }
xetal-view = { path = "../vendor/xetal/components/view/crates/xetal-view" }
yew = { version = "0.21", features = ["csr"] }
web-sys = { version = "0.3", features = ["Window", "Location", "EventTarget", "HtmlTextAreaElement"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[build-dependencies]
xetal-view = { path = "../vendor/xetal/components/view/crates/xetal-view" }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[dev-dependencies]
xetal-grid = { path = "../vendor/xetal/components/view/crates/xetal-grid" }

[workspace]
