# Every Cargo build in this repo uses the one ./target: cargo finds this
# file by walking up from where it runs (except the X_eTaL clone in
# work/xetal: scripts/xetal.sh builds it into its own target/).
[build]
target-dir = "target"

# The browser runs the evaluator on its stack (WebAssembly has no
# threads): give it room for deep recursion, as X_eTaL's live demo does.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=67108864"]
